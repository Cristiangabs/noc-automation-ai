services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Caracas
      - TZ=America/Caracas
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n

  openwa-api:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa-api
    restart: always
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - API_KEY=${OPENWA_API_KEY}
    volumes:
      - openwa_sessions:/app/sessions

volumes:
  n8n_data:
  openwa_sessions:
